name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci && npm run build && npm run typecheck
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          cd frontend
          npm run test:e2e
      - run: docker compose build
      - run: docker compose --profile test run --rm test
